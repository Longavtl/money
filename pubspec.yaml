name: money
description: "MoneyMate - Financial Calculator"
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  gap: ^3.0.1
  flutter_svg:
  flutter_spinkit: ^5.2.2
  fluttertoast: ^9.0.0
  cached_network_image: ^3.4.1

  # Charts
  fl_chart: ^0.68.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  shared_preferences: ^2.2.2
  path_provider:

  # Architecture
  dartz:
  equatable: ^2.0.5
  freezed: ^3.2.3

  # Networking (for future)
  dio: ^5.6.0
  connectivity_plus: ^6.0.5
  internet_connection_checker: ^3.0.1

  # In-App Purchase
  in_app_purchase: ^3.2.3

  # PDF Export
  pdf: ^3.10.0
  printing: ^5.12.0

  # Share
  share_plus: ^12.0.1

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Calendar
  table_calendar: ^3.1.3

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  saver_gallery: ^4.1.0
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.0
  logging: ^1.2.0
  device_info_plus: ^9.1.2
  flutter_animate: 4.5.2
  webview_flutter: ^4.13.1

  # Firebase
  firebase_core: ^4.3.0
  firebase_remote_config: ^6.1.3
  firebase_messaging: ^16.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_gen_runner: ^5.4.0
  build_runner: ^2.5.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/svg/
    - shorebird.yaml

flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true

flutter_intl:
  enabled: true
